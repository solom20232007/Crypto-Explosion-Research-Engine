name: Daily Research Recommendations
on:
  schedule:
    - cron: "25 1 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  recommend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Checkout collector code (research branch)
        uses: actions/checkout@v4
        with:
          ref: main
          path: research
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas numpy scikit-learn requests
      - name: Top up candles first (GitHub cron is best effort; the hourly collector may be late)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        working-directory: research
        run: |
          pip install -r requirements.txt
          python -m src.continuous_candle_collector --symbols-file config/research_symbols.txt --lookback-hours 12 --output-dir /tmp/candle_topup
      - name: Score latest 00:00 UTC bar and publish
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python scripts/daily_recommendations.py
      - name: Publish latest_recommendations.json to branch data/recommendations (public, research only)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          python scripts/export_recs_json.py
          cp latest_recommendations.json /tmp/latest_recommendations.json
          git config user.name "recs-bot"; git config user.email "recs-bot@users.noreply.github.com"
          git checkout --orphan data-tmp
          git rm -rf . -q || true
          cp /tmp/latest_recommendations.json .
          git add latest_recommendations.json
          git commit -qm "Update latest recommendations [skip ci]"
          git push -f origin HEAD:refs/heads/data/recommendations
      - name: Score outcomes of past recommendations (bars with all 72 following hours observed)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          for i in 1 2 3; do
            curl -sS --fail-with-body --max-time 120 -X POST "$SUPABASE_URL/rest/v1/rpc/refresh_recommendation_outcomes" \
              -H "apikey: $SUPABASE_SECRET_KEY" -H "Authorization: Bearer $SUPABASE_SECRET_KEY" \
              -H "Content-Type: application/json" -d '{}' && echo && exit 0
            echo "attempt $i failed"; sleep 20
          done
          exit 1
