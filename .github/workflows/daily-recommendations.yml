name: Daily Research Recommendations
on:
  schedule:
    - cron: "25 1 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recommend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas numpy scikit-learn requests
      - name: Score latest 00:00 UTC bar and publish
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python scripts/daily_recommendations.py
