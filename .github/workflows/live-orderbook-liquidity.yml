name: Live Order-Book Liquidity Snapshot
on:
  workflow_dispatch:
    inputs:
      max_symbols:
        description: "Top symbols by 24h USDT volume"
        required: true
        default: "100"
        type: string
      min_quote_volume:
        description: "Minimum 24h quote volume in USDT"
        required: true
        default: "100000"
        type: string
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/binance-prebreakout-advisor-v1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Run research tests
        run: python -m pytest -q
      - name: Collect live order-book snapshots
        env:
          MAX_SYMBOLS: ${{ inputs.max_symbols }}
          MIN_QUOTE_VOLUME: ${{ inputs.min_quote_volume }}
        run: python -m src.orderbook_liquidity
      - name: Upload timestamped snapshot and summary
        uses: actions/upload-artifact@v4
        with:
          name: live-orderbook-liquidity-${{ github.run_id }}
          path: reports/orderbook_liquidity/
          if-no-files-found: error
          retention-days: 30
