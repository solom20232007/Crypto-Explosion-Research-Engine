name: Global EVM Transfer Collectors (Ethereum + BSC)

on:
  schedule:
    - cron: "*/5 * * * *"
  push:
    branches:
      - research/binance-prebreakout-advisor-v1
    paths:
      - .github/workflows/routescan-manual-trigger.txt
  workflow_dispatch:
    inputs:
      lookback_minutes:
        description: "Overlapping incremental lookback window (1-1440 minutes)"
        required: false
        default: "7"
        type: string
      max_pages:
        description: "Maximum Routescan pages per time window; dense windows are split"
        required: false
        default: "50"
        type: string
      max_total_requests:
        description: "Safety cap on API calls per chain per run"
        required: false
        default: "1000"
        type: string

permissions:
  contents: read

concurrency:
  group: global-evm-transfer-collectors
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/binance-prebreakout-advisor-v1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Run test suite
        run: python -m pytest -q
      - name: Collect Ethereum and BSC global token transfers
        env:
          ROUTESCAN_API_KEY: ${{ secrets.ROUTESCAN_API_KEY }}
          BSC_RPC_URL: ${{ secrets.BSC_RPC_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          ROUTESCAN_LOOKBACK_MINUTES: ${{ inputs.lookback_minutes || '7' }}
          ROUTESCAN_MAX_PAGES: ${{ inputs.max_pages || '50' }}
          ROUTESCAN_MAX_TOTAL_REQUESTS: ${{ inputs.max_total_requests || '1000' }}
        run: |
          set +e
          echo "=== Ethereum / Routescan ==="
          python -m src.routescan_whale_collector --minutes "${ROUTESCAN_LOOKBACK_MINUTES}" --max-pages "${ROUTESCAN_MAX_PAGES}" --max-total-requests "${ROUTESCAN_MAX_TOTAL_REQUESTS}"
          ethereum_status=$?
          echo "=== BSC / Public JSON-RPC ==="
          python -m src.bsc_rpc_whale_collector --minutes "${ROUTESCAN_LOOKBACK_MINUTES}" --max-total-requests "${ROUTESCAN_MAX_TOTAL_REQUESTS}"
          bsc_status=$?
          if [ "$ethereum_status" -ne 0 ] || [ "$bsc_status" -ne 0 ]; then
            echo "Collector summary: ethereum_exit=$ethereum_status bsc_exit=$bsc_status"
            exit 1
          fi
