name: Routescan Global EVM Transfer Collector

on:
  push:
    branches:
      - research/binance-prebreakout-advisor-v1
    paths:
      - ".github/workflows/routescan-whale-collector.yml"
  workflow_dispatch:
    inputs:
      lookback_hours:
        description: "Overlapping lookback window (1-24 hours)"
        required: false
        default: "2"
        type: string
      max_pages:
        description: "Maximum pages per chain; fail rather than truncate"
        required: false
        default: "100"
        type: string

permissions:
  contents: read

concurrency:
  group: routescan-whale-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/binance-prebreakout-advisor-v1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Run test suite
        run: python -m pytest -q
      - name: Collect global EVM ERC-20 transfers from Routescan
        env:
          ROUTESCAN_API_KEY: ${{ secrets.ROUTESCAN_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          ROUTESCAN_LOOKBACK_HOURS: ${{ inputs.lookback_hours || '2' }}
          ROUTESCAN_MAX_PAGES: ${{ inputs.max_pages || '100' }}
        run: python -m src.routescan_whale_collector --hours "${ROUTESCAN_LOOKBACK_HOURS}" --max-pages "${ROUTESCAN_MAX_PAGES}"
