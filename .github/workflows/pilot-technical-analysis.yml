name: Pilot Technical Analysis (BTC ETH SOL)

on:
  workflow_dispatch:
  push:
    branches:
      - research/binance-prebreakout-advisor-v1
    paths:
      - "src/technical_indicators.py"
      - "src/analysis.py"
      - "src/modeling.py"
      - "src/prebreakout_advisor.py"
      - "tests/test_technical_indicators.py"
      - ".github/workflows/pilot-technical-analysis.yml"

permissions:
  contents: read

jobs:
  test-and-analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
        with:
          ref: research/binance-prebreakout-advisor-v1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run automated tests
        run: python -m pytest -q

      - name: Validate Supabase secrets
        shell: bash
        run: |
          test -n "$SUPABASE_URL" || (echo "Missing SUPABASE_URL Actions secret" && exit 1)
          test -n "$SUPABASE_SECRET_KEY" || (echo "Missing SUPABASE_SECRET_KEY Actions secret" && exit 1)

      - name: Load pilot candles from Supabase (read-only)
        run: |
          python main.py load-supabase --symbols BTCUSDT ETHUSDT SOLUSDT --timeframe 1h

      - name: Build technical features and breakout-phase report
        run: |
          python main.py analyze --symbols BTCUSDT ETHUSDT SOLUSDT

      - name: Validate generated report
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd

          features_path = Path("data/features.csv")
          summary_path = Path("reports/analysis_summary.json")
          assert features_path.exists() and features_path.stat().st_size > 0, "Missing/empty data/features.csv"
          assert summary_path.exists() and summary_path.stat().st_size > 0, "Missing/empty analysis summary"
          features = pd.read_csv(features_path, nrows=5)
          required = {
              "prebreakout_score", "early_breakout_score", "breakout_phase",
              "rsi_6", "rsi_21", "macd_line_pct", "adx_14", "volume_zscore_20",
              "target_future_15pct_24h"
          }
          missing = sorted(required - set(features.columns))
          assert not missing, f"Missing expected columns: {missing}"
          summary = json.loads(summary_path.read_text(encoding="utf-8"))
          assert summary.get("symbols_analyzed") == 3, f"Expected 3 symbols, got {summary.get('symbols_analyzed')}"
          assert not summary.get("failed_files"), f"Some symbols failed: {summary.get('failed_files')}"
          print(json.dumps({
              "symbols_analyzed": summary["symbols_analyzed"],
              "rows": summary["rows"],
              "date_min": summary["date_min"],
              "date_max": summary["date_max"],
              "technical_feature_columns": summary["technical_feature_columns"],
              "breakout_phase_rows": summary["breakout_phase_rows"],
          }, indent=2))
          PY

      - name: Upload pilot analysis reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pilot-technical-analysis-reports
          path: |
            reports/analysis_summary.json
            reports/explosions.csv
            data/features.csv
            data/raw/BTCUSDT_1h.csv
            data/raw/ETHUSDT_1h.csv
            data/raw/SOLUSDT_1h.csv
          if-no-files-found: warn
          retention-days: 14
