name: True Pre-Breakout and Pump-Pattern Dataset
on:
  push:
    branches:
      - research/binance-prebreakout-advisor-v1
    paths:
      - .github/workflows/true-prebreakout-dataset.yml
      - src/true_prebreakout_dataset.py
      - tests/test_true_prebreakout_dataset.py
  workflow_dispatch:
    inputs:
      cases_per_tier:
        description: "Matched event cases per tier"
        required: true
        default: "20"
        type: string
permissions:
  contents: read
concurrency:
  group: true-prebreakout-dataset
  cancel-in-progress: true
jobs:
  dataset:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/binance-prebreakout-advisor-v1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Download historical event catalogue
        uses: actions/download-artifact@v4
        with:
          name: historical-small-altcoin-surge-scan
          path: input-artifact
          github-token: \${{ github.token }}
          repository: \${{ github.repository }}
          run-id: 41226442142
      - name: Run dataset unit tests
        run: python -m pytest -q tests/test_true_prebreakout_dataset.py
      - name: Build leakage-safe lead-time and pump-pattern dataset
        run: |
          python -m src.true_prebreakout_dataset \
            --input-dir input-artifact/surge_scan \
            --out-dir reports/true_prebreakout \
            --cases-per-tier "\${{ inputs.cases_per_tier || '20' }}" \
            --pause-seconds 0.1
      - name: Upload research dataset
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: true-prebreakout-pump-pattern-dataset
          path: |
            reports/true_prebreakout/true_prebreakout_dataset.csv
            reports/true_prebreakout/true_prebreakout_summary.json
          if-no-files-found: warn
          retention-days: 30
