name: News Collector (scheduled)
on:
  schedule:
    - cron: "40 */3 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: news-collector
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - run: python -m pytest -q tests/test_news_monitor.py tests/test_binance_public_announcements.py
      - name: Build feature rows for today's 00:00 UTC signal
        run: |
          mkdir -p reports/surge_scan
          day_ms=$(( ($(date -u +%s) / 86400 - 1) * 86400000 ))
          { echo "symbol,open_time"; grep -v '^#' config/research_symbols.txt | grep . | while read -r s; do echo "$s,$day_ms"; done; } > reports/surge_scan/daily_candles.csv
          wc -l reports/surge_scan/daily_candles.csv
      - name: Collect RSS + Binance announcements and upload
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          python -m src.news_monitor --feed-config config/news_feeds.json --aliases config/news_symbol_aliases.json \
            --candles reports/surge_scan/daily_candles.csv --binance-public-limit 50 --upload-supabase
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: news-collector-reports
          path: reports/news*/
          if-no-files-found: ignore
          retention-days: 14
