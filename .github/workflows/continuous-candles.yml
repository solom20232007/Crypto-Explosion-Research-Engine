name: Continuous Binance Hourly Candle Collection

on:
  push:
    paths:
      - ".github/workflows/continuous-candles.yml"
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      lookback_hours:
        description: "Rolling backfill window (hours)"
        required: false
        default: "72"
        type: string
      max_symbols:
        description: "Optional symbol cap for a test run; leave empty for the full universe"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: continuous-binance-hourly-candles
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout research implementation
        uses: actions/checkout@v4
        with:
          ref: research/binance-prebreakout-advisor-v1
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Compile and test
        run: |
          python -m compileall -q src tests
          python -m pytest -q
      - name: Collect closed Binance 1h candles and upsert to Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          LOOKBACK_HOURS: ${{ inputs.lookback_hours || '72' }}
          MAX_SYMBOLS: ${{ inputs.max_symbols }}
        run: |
          args=(--lookback-hours "$LOOKBACK_HOURS")
          if [ -n "$MAX_SYMBOLS" ]; then args+=(--max-symbols "$MAX_SYMBOLS"); fi
          python -m src.continuous_candle_collector "${args[@]}"
      - name: Upload collection report
        uses: actions/upload-artifact@v4
        with:
          name: continuous-binance-hourly-candles
          path: reports/continuous_candles/
          if-no-files-found: error
          retention-days: 30
