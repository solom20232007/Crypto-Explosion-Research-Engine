name: On-chain Pilot (mapped tokens only)
on:
  schedule:
    - cron: "50 * * * *"
  workflow_dispatch:
    inputs:
      hours:
        description: "Complete hours to (re)fetch (ignored when start is set)"
        default: "3"
        type: string
      start:
        description: "Backfill start (ISO UTC, e.g. 2026-10-31T00:00:00Z); empty = rolling window"
        default: ""
        type: string
      end:
        description: "Backfill end (ISO UTC, exclusive); empty = now"
        default: ""
        type: string
permissions:
  contents: read
concurrency:
  group: onchain-pilot
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          ROUTESCAN_API_KEY: ${{ secrets.ROUTESCAN_API_KEY }}
          HOURS: ${{ inputs.hours || '12' }}
          START_ISO: ${{ inputs.start }}
          END_ISO: ${{ inputs.end }}
        run: python scripts/onchain_pilot.py
