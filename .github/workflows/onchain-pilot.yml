name: On-chain Pilot (mapped tokens only)
on:
  schedule:
    - cron: "50 * * * *"
  workflow_dispatch:
    inputs:
      hours:
        description: "Complete hours to (re)fetch"
        default: "3"
        type: string
permissions:
  contents: read
concurrency:
  group: onchain-pilot
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          ROUTESCAN_API_KEY: ${{ secrets.ROUTESCAN_API_KEY }}
          HOURS: ${{ inputs.hours || '3' }}
        run: python scripts/onchain_pilot.py
