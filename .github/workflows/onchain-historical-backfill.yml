name: Historical On-chain Transfer Backfill

on:
  push:
    branches:
      - research/binance-prebreakout-advisor-v1
    paths:
      - .github/workflows/onchain-backfill-trigger.txt
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      start_utc:
        description: "Initial UTC start time (used only if no checkpoint exists)"
        required: false
        default: "2026-11-04T00:00:00Z"
        type: string
      provider:
        description: "Which chain collector to resume"
        required: true
        default: "both"
        type: choice
        options:
          - both
          - routescan
          - bsc
      max_chunks:
        description: "Maximum completed chunks per chain in this run"
        required: false
        default: "4"
        type: string
      max_total_requests:
        description: "Maximum provider requests per chain in this run"
        required: false
        default: "1000"
        type: string

permissions:
  contents: read

concurrency:
  group: historical-onchain-transfer-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/binance-prebreakout-advisor-v1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Run test suite
        run: python -m pytest -q
      - name: Resume checkpointed Ethereum and BSC backfill
        env:
          ROUTESCAN_API_KEY: ${{ secrets.ROUTESCAN_API_KEY }}
          BSC_RPC_URL: ${{ secrets.BSC_RPC_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          BACKFILL_START_UTC: ${{ inputs.start_utc || '2026-11-04T00:00:00Z' }}
          BACKFILL_PROVIDER: ${{ inputs.provider || 'both' }}
          BACKFILL_MAX_CHUNKS: ${{ inputs.max_chunks || '4' }}
          BACKFILL_MAX_TOTAL_REQUESTS: ${{ inputs.max_total_requests || '1000' }}
        run: |
          python -m src.onchain_backfill \
            --provider "${BACKFILL_PROVIDER}" \
            --start-utc "${BACKFILL_START_UTC}" \
            --chunk-minutes 30 \
            --chunk-blocks 5000 \
            --max-chunks "${BACKFILL_MAX_CHUNKS}" \
            --max-pages 50 \
            --max-total-requests "${BACKFILL_MAX_TOTAL_REQUESTS}"
