name: BSC RPC Live Smoke Test

on:
  push:
    branches:
      - research/binance-prebreakout-advisor-v1
    paths:
      - .github/workflows/bsc-rpc-smoke-test.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bsc-rpc-live-smoke-test
  cancel-in-progress: false

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/binance-prebreakout-advisor-v1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install HTTP client
        run: python -m pip install requests
      - name: Probe BSC RPC safely (read-only, bounded)
        env:
          BSC_RPC_URL: ${{ secrets.BSC_RPC_URL }}
        run: |
          python - <<'PY'
          import json, os, requests, sys
          url = os.getenv("BSC_RPC_URL") or "https://bsc-dataseed.bnbchain.org"
          timeout = (10, 30)
          counter = 0

          def post(payload):
              global counter
              counter += 1
              response = requests.post(url, json=payload, timeout=timeout)
              response.raise_for_status()
              return response.json()

          def rpc(method, params):
              global counter
              request_id = counter + 1
              data = post({"jsonrpc": "2.0", "id": request_id, "method": method, "params": params})
              if not isinstance(data, dict) or data.get("error") or "result" not in data:
                  raise RuntimeError(f"{method} failed: {data}")
              return data["result"]

          latest = rpc("eth_blockNumber", [])
          block = rpc("eth_getBlockByNumber", [latest, False])
          if not isinstance(block, dict) or not isinstance(block.get("transactions"), list):
              raise RuntimeError("Latest block response is incomplete")
          txs = block["transactions"][:10]
          print(json.dumps({
              "probe": "latest_block",
              "latest_block": latest,
              "transaction_count": len(block["transactions"]),
              "sample_receipts": len(txs),
          }, sort_keys=True))

          if txs:
              calls = []
              ids = []
              for i, tx in enumerate(txs, 1001):
                  ids.append(i)
                  calls.append({"jsonrpc": "2.0", "id": i,
                                "method": "eth_getTransactionReceipt", "params": [tx]})
              try:
                  batch = post(calls)
                  if not isinstance(batch, list):
                      print(json.dumps({"probe": "json_rpc_batch", "supported": False,
                                        "reason": "response was not a JSON array"}))
                  else:
                      by_id = {item.get("id"): item for item in batch if isinstance(item, dict)}
                      missing = [i for i in ids if i not in by_id]
                      errors = [i for i in ids if i in by_id and by_id[i].get("error")]
                      nulls = [i for i in ids if i in by_id and by_id[i].get("result") is None]
                      if missing or errors or nulls:
                          raise RuntimeError(f"Batch receipt coverage failed: missing={len(missing)}, errors={len(errors)}, nulls={len(nulls)}")
                      print(json.dumps({"probe": "json_rpc_batch", "supported": True,
                                        "requested": len(ids), "returned": len(by_id),
                                        "all_receipts_present": True}))
              except requests.HTTPError as exc:
                  print(json.dumps({"probe": "json_rpc_batch", "supported": False,
                                    "http_error": str(exc)}))
          try:
              receipts = rpc("eth_getBlockReceipts", [latest])
              print(json.dumps({"probe": "eth_getBlockReceipts",
                                "supported": isinstance(receipts, list),
                                "receipt_count": len(receipts) if isinstance(receipts, list) else None}))
          except Exception as exc:
              print(json.dumps({"probe": "eth_getBlockReceipts", "supported": False,
                                "reason": str(exc)[:500]}))
          print(json.dumps({"probe": "summary", "http_posts": counter,
                            "note": "HTTP post count is not proof of provider billing units."}))
          PY
