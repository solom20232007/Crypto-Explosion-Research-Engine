name: Pre-breakout advisor tests

on:
  push:
    branches:
      - research/binance-prebreakout-advisor-v1
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Run pre-breakout advisor tests
        run: pytest -q tests/test_prebreakout_advisor.py
