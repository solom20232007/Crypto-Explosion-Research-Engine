name: Research Unit Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "research/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Compile Python files
        run: python -m compileall -q src main.py tests
      - name: Run unit tests
        run: python -m pytest -q
