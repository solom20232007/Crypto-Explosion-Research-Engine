name: News and Announcements Monitor
on:
  workflow_dispatch:
    inputs:
      feeds:
        description: "Optional comma-separated RSS/Atom feed URLs"
        required: false
        default: ""
        type: string
      feed_config:
        description: "Curated feed registry JSON"
        required: false
        default: "config/news_feeds.json"
        type: string
      candles_path:
        description: "Daily candle CSV path"
        required: true
        default: "reports/surge_scan/daily_candles.csv"
        type: string
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/binance-prebreakout-advisor-v1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Run tests
        run: python -m pytest -q
      - name: Collect timestamp-safe news (including public Binance announcements)
        run: python -m src.news_monitor --feed-config "${{ inputs.feed_config }}" --feeds "${{ inputs.feeds }}" --candles "${{ inputs.candles_path }}" --binance-public-limit 50
      - name: Upload news research artifact
        uses: actions/upload-artifact@v4
        with:
          name: timestamp-safe-news-monitor
          path: reports/news_monitor/
          if-no-files-found: error
          retention-days: 30
