name: Routescan Collector Tests

on:
  push:
    branches:
      - research/binance-prebreakout-advisor-v1
    paths:
      - src/routescan_whale_collector.py
      - tests/test_routescan_whale_collector.py
      - .github/workflows/routescan-collector-tests.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: routescan-collector-tests
  cancel-in-progress: false

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/binance-prebreakout-advisor-v1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Run test suite
        run: python -m pytest -q
