name: Run Research Eval
on:
  workflow_dispatch:
    inputs:
      script:
        description: "Script under scripts/ ending in _eval.py"
        default: "event_level_eval.py"
        type: string
permissions:
  contents: read
jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas numpy scikit-learn requests
      - name: Run
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SCRIPT: ${{ inputs.script }}
        run: |
          case "$SCRIPT" in *_eval.py) ;; *) echo "script must end in _eval.py"; exit 1;; esac
          python "scripts/$SCRIPT"
