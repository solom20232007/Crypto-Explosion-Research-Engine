name: News Monitor Dispatcher
on:
  workflow_dispatch:
    inputs:
      feeds:
        description: "Optional comma-separated RSS/Atom feed URLs"
        required: false
        default: ""
        type: string
      feed_config:
        description: "Curated feed registry JSON"
        required: false
        default: "config/news_feeds.json"
        type: string
      candles_path:
        description: "Daily candle CSV path (optional; an empty fallback is created if absent)"
        required: false
        default: "reports/surge_scan/daily_candles.csv"
        type: string
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
        with:
          ref: research/binance-prebreakout-advisor-v1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Run news monitor tests
        run: python -m pytest -q tests/test_news_monitor.py tests/test_binance_public_announcements.py
      - name: Prepare candle input
        env:
          CANDLES_PATH: ${{ inputs.candles_path }}
        run: |
          if [ ! -f "$CANDLES_PATH" ]; then
            echo "Daily candles not present in the research branch checkout."
            echo "Creating an empty candle input so news_events.csv can still be collected."
            mkdir -p "$(dirname "$CANDLES_PATH")"
            printf 'symbol,open_time\n' > "$CANDLES_PATH"
          fi
      - name: Collect timestamp-safe news and public Binance announcements
        env:
          FEEDS: ${{ inputs.feeds }}
          FEED_CONFIG: ${{ inputs.feed_config }}
          CANDLES_PATH: ${{ inputs.candles_path }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          python -m src.news_monitor --feed-config "$FEED_CONFIG" --feeds "$FEEDS" --candles "$CANDLES_PATH" --binance-public-limit 50 --upload-supabase
      - name: Upload news research artifact
        uses: actions/upload-artifact@v4
        with:
          name: timestamp-safe-news-monitor
          path: reports/news_monitor/
          if-no-files-found: error
          retention-days: 30
