
name: Crypto Research - First Test

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crypto-research-first-test
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download historical data
        run: |
          python main.py collect \
            --symbols BTCUSDT ETHUSDT SOLUSDT \
            --interval 1h \
            --start 2025-10-01 \
            --end "$(date -u +%F)"
      
      - name: Audit historical data quality
        run: >
          python -m src.quality_audit
          --symbols BTCUSDT ETHUSDT SOLUSDT
          --interval 1h

      - name: Save data quality report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: data-quality-audit
          path: |
            reports/data_quality_report.csv
            reports/data_quality_report.md
          if-no-files-found: warn


      - name: Analyze historical explosions
        run: |
          python main.py analyze \
            --symbols BTCUSDT ETHUSDT SOLUSDT

      - name: Train baseline model
        run: python main.py train

      - name: Upload research data to Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python main.py upload

      - name: Save research results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crypto-research-first-test
          path: |
            data/raw/
            data/features.csv
            reports/
            models/
          if-no-files-found: warn
          retention-days: 14
