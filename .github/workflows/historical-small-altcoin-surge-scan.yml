name: Historical Small-Altcoin Surge Scanner
# Research-only full-history run; includes causal technical features and leakage-safe dataset evaluation.
on:
  push:
    branches:
      - research/binance-prebreakout-advisor-v1
    paths:
      - .github/workflows/historical-small-altcoin-surge-scan.yml
      - src/historical_surge_scanner.py
      - tests/test_historical_surge_scanner.py
      - src/prebreakout_dataset.py
      - tests/test_prebreakout_dataset.py
      - src/evaluate_prebreakout.py
      - src/audit_prebreakout_data.py
      - tests/test_audit_prebreakout_data.py
  workflow_dispatch:
    inputs:
      start:
        description: "UTC start (inclusive)"
        required: true
        default: "2023-10-28T00:00:00Z"
        type: string
      end:
        description: "UTC end (exclusive)"
        required: true
        default: "2026-10-28T00:00:00Z"
        type: string
      max_symbols:
        description: "Smoke-test cap; 0 scans all eligible pairs"
        required: true
        default: "0"
        type: string
      max_events:
        description: "Top-ranked event dates to inspect hourly"
        required: true
        default: "250"
        type: string
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/binance-prebreakout-advisor-v1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Run tests
        run: python -m pytest -q
      - name: Scan history and gather hourly context
        env:
          SCAN_START: ${{ inputs.start || '2023-10-28T00:00:00Z' }}
          SCAN_END: ${{ inputs.end || '2026-10-28T00:00:00Z' }}
          MAX_SYMBOLS: ${{ inputs.max_symbols || '0' }}
          MAX_EVENTS: ${{ inputs.max_events || '250' }}
        run: |
          MAX_ARGS=()
          if [ "$MAX_SYMBOLS" != "0" ]; then
            MAX_ARGS+=(--max-symbols "$MAX_SYMBOLS")
          fi
          python -m src.historical_surge_scanner \
            --start "$SCAN_START" --end "$SCAN_END" \
            --max-events "$MAX_EVENTS" "${MAX_ARGS[@]}"
      - name: Build leakage-safe pre-breakout dataset
        run: python -m src.prebreakout_dataset
      - name: Evaluate chronological baselines and model
        run: python -m src.evaluate_prebreakout
      - name: Audit historical data quality
        run: python -m src.audit_prebreakout_data
      - name: Validate outputs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd
          root=Path("reports/surge_scan")
          summary=json.loads((root/"surge_scan_summary.json").read_text())
          events=pd.read_csv(root/"surge_events.csv")
          context=pd.read_csv(root/"surge_pre_event_context.csv")
          daily=pd.read_csv(root/"daily_candles.csv")
          dataset=pd.read_csv("reports/prebreakout_dataset/prebreakout_dataset.csv")
          assert len(daily)>0 and len(dataset)>0
          assert not {"BTCUSDT","ETHUSDT","SOLUSDT"}.intersection(set(dataset.symbol))
          assert summary["symbols_scanned"]>0
          assert not {"BTCUSDT","ETHUSDT","SOLUSDT"}.intersection(set(events.get("symbol",[])))
          print(json.dumps({"symbols_scanned":summary["symbols_scanned"],"event_rows":summary["event_rows"],
            "selected_events_with_hourly_context":summary["selected_events_with_hourly_context"],
            "daily_candle_rows":len(daily),"dataset_rows":len(dataset),
            "failed_symbols":summary["symbols_with_errors"],"context_rows":len(context),
            "survivorship_bias_warning":summary["survivorship_bias_warning"]},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: historical-small-altcoin-surge-scan
          path: |
            reports/surge_scan/
            reports/prebreakout_dataset/
          if-no-files-found: warn
          retention-days: 30
