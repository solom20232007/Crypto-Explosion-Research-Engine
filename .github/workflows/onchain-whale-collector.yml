name: On-chain Whale Transfer Collector

on:
  workflow_dispatch:
    inputs:
      min_usd:
        description: "Minimum provider-valued transfer size in USD"
        required: false
        default: "100000"
        type: string
      lookback_hours:
        description: "Lookback window (1-24 hours)"
        required: false
        default: "3"
        type: string
  schedule:
    - cron: "17,47 * * * *"

permissions:
  contents: read

concurrency:
  group: onchain-whale-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/binance-prebreakout-advisor-v1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Run test suite
        run: python -m pytest -q
      - name: Collect large on-chain transfers
        env:
          BITQUERY_ACCESS_TOKEN: ${{ secrets.BITQUERY_ACCESS_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          WHALE_MIN_TRANSFER_USD: ${{ inputs.min_usd || '100000' }}
        run: python -m src.onchain_whale_collector --min-usd "${WHALE_MIN_TRANSFER_USD}" --hours "${{ inputs.lookback_hours || '3' }}"
