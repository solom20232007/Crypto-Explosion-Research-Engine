name: On-chain All-Token Transfer Collector

on:
  push:
    branches:
      - research/binance-prebreakout-advisor-v1
    paths:
      - '.github/workflows/onchain-whale-collector.yml'
      - 'src/onchain_whale_collector.py'
      - 'tests/test_onchain_whale_collector.py'
      - 'config/onchain_whale_chains.json'
  workflow_dispatch:
    inputs:
      lookback_hours:
        description: "Overlapping lookback window (1-24 hours)"
        required: false
        default: "1"
        type: string
      max_pages:
        description: "Maximum pages per chain; run fails rather than silently truncate"
        required: false
        default: "100"
        type: string
  schedule:
    - cron: "17,47 * * * *"

permissions:
  contents: read

concurrency:
  group: onchain-whale-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/binance-prebreakout-advisor-v1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Run test suite
        run: python -m pytest -q
      - name: Collect all token transfers (no USD threshold)
        env:
          BITQUERY_ACCESS_TOKEN: ${{ secrets.BITQUERY_ACCESS_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          ONCHAIN_LOOKBACK_HOURS: ${{ inputs.lookback_hours || '1' }}
          ONCHAIN_MAX_PAGES: ${{ inputs.max_pages || '100' }}
        run: python -m src.onchain_whale_collector --hours "${ONCHAIN_LOOKBACK_HOURS}" --max-pages "${ONCHAIN_MAX_PAGES}"
